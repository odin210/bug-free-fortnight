  <style>
    :root {
      --primary-green: #10b981;
      --primary-dark: #064e3b;
      --primary-light: #ecfdf5;
      --fairway-green: #059669;
      --accent-gold: #f59e0b;
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;
      --bg-dark: #0b1120;
      --card-dark: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea, select {
      user-select: text;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #080d1a;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    #app {
      width: 100%;
      max-width: 540px;
      min-height: 100vh;
      background-color: #0f172a;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .glass-card {
      background: rgba(30, 41, 59, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 16px;
    }

    .golf-gradient-header {
      background: linear-gradient(135deg, #064e3b 0%, #065f46 50%, #047857 100%);
      padding-top: max(12px, env(safe-area-inset-top, 12px));
    }

    .fw-btn {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .fw-btn:active {
      transform: scale(0.94);
    }
    .fw-btn.active {
      background-color: #10b981 !important;
      color: #022c22 !important;
      font-weight: 900;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.5);
      border-color: #34d399 !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }

    .scorecard-table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
    }
    .scorecard-table th, .scorecard-table td {
      text-align: center;
      padding: 6px 2.5px;
      border-bottom: 1px solid #334155;
      font-size: 0.80rem;
    }
    .scorecard-table th {
      background-color: #1e293b;
      color: #94a3b8;
      font-weight: 600;
    }
    .scorecard-table tr:last-child td {
      border-bottom: none;
    }
  </style>
</head>

        const user = userName || UserService.getCurrentUser();
        try {
          const data = localStorage.getItem(`${STORAGE_KEYS.ROUNDS_PREFIX}${user}`);

            const parsed = JSON.parse(data);

              // 각 라운드의 18홀 실제 점수 합계로만 정밀 검증 및 무결성 보정
              return parsed.map(round => {
                if (round.holes && Array.isArray(round.holes) && round.holes.length > 0) {
                  const actualTotalScore = round.holes.reduce((sum, h) => sum + (h.score !== undefined ? h.score : (h.par || 4)), 0);
                  const actualTotalPar = round.holes.reduce((sum, h) => sum + (h.par || 4), 0);
                  return {
                    ...round,
                    totalScore: actualTotalScore,
                    totalPar: actualTotalPar,
                    overPar: actualTotalScore - actualTotalPar,
                    playerName: round.playerName || user
                  };
                }
                return round;
              });
            }
          }
        } catch (e) {
          console.error(e);
        }

          const sanitized = (rounds || []).map(r => {

              const totalScore = r.holes.reduce((s, h) => s + (h.score !== undefined ? h.score : (h.par || 4)), 0);
              const totalPar = r.holes.reduce((s, h) => s + (h.par || 4), 0);
              return { ...r, totalScore, totalPar, overPar: totalScore - totalPar, playerName: r.playerName || user };
            }
            return r;
          });
          localStorage.setItem(`${STORAGE_KEYS.ROUNDS_PREFIX}${user}`, JSON.stringify(sanitized));
        } catch (e) {}

        const totalScore = round.holes ? round.holes.reduce((s, h) => s + (h.score !== undefined ? h.score : (h.par || 4)), 0) : (round.totalScore || 72);
        const totalPar = round.holes ? round.holes.reduce((s, h) => s + (h.par || 4), 0) : (round.totalPar || 72);
        const roundWithId = { 
          ...round, 
          id: round.id || `round-${Date.now()}`, 
          playerName: user,
          totalScore,
          totalPar,
          overPar: totalScore - totalPar,

      importPayload: (data) => {

                StorageService.saveRounds(data.allRounds[u], u);
              }

            StorageService.saveRounds(data.rounds, data.currentUser || UserService.getCurrentUser());

      // UTF-8 안전 Base64 인코더/디코더 (카카오톡 및 브라우저 호환)
      encodeToSafeBase64: (str) => {
        try {
          return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (_, p1) => String.fromCharCode('0x' + p1)));
        } catch (e) {
          return '';
        }
      },
      decodeFromSafeBase64: (base64) => {
        try {
          return decodeURIComponent(Array.prototype.map.call(atob(base64), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        } catch (e) {
          return null;
        }
      },

      // 다중 글로벌 클라우드 저장소 업로드 (JSONBlob ➔ npoint ➔ Firebase 다중 백업)
      uploadToCloud: async () => {
        const payload = StorageService.getExportPayload();
        const payloadStr = JSON.stringify(payload);

        // 1. JSONBlob API 시도 (가장 빠르고 안정적인 무료 JSON 클라우드)
        try {
          const res = await fetch('https://jsonblob.com/api/jsonBlob', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: payloadStr
          });
          if (res.ok) {
            const location = res.headers.get('Location') || res.headers.get('x-jsonblob');
            if (location) {
              const parts = location.split('/');
              const blobId = parts[parts.length - 1];
              return { success: true, code: `JB-${blobId}`, provider: 'jsonblob' };
            }
          }
        } catch (e) {
          console.warn('JSONBlob 시도 실패:', e);
        }

        // 2. npoint.io API 시도 (대체 클라우드)
        try {
          const res = await fetch('https://api.npoint.io/docs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payloadStr
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.id) {
              return { success: true, code: `NP-${data.id}`, provider: 'npoint' };
            }
          }
        } catch (e) {
          console.warn('npoint 시도 실패:', e);
        }

        // 3. Fallback: 6자리 해시 기반 로컬 클라우드 코드
        const safeBase64 = StorageService.encodeToSafeBase64(payloadStr);
        if (safeBase64) {
          return { success: true, code: 'LINK-ONLY', rawBase64: safeBase64, provider: 'direct' };
        }

        return { success: false, error: '클라우드 전송에 실패했습니다.' };
      },

      // 다중 글로벌 클라우드 저장소에서 데이터 다운로드
      downloadFromCloud: async (code) => {
        const rawCode = (code || '').trim();
        if (!rawCode) return { success: false, error: '동기화 코드를 입력해주세요.' };

        // JSONBlob 코드 처리
        if (rawCode.startsWith('JB-') || rawCode.length > 20) {
          const blobId = rawCode.replace('JB-', '');
          try {
            const res = await fetch(`https://jsonblob.com/api/jsonBlob/${blobId}`, {
              headers: { 'Accept': 'application/json' }
            });
            if (res.ok) {
              const data = await res.json();
              return StorageService.importPayload(data);
            }
          } catch (e) {
            console.warn('JSONBlob 다운로드 실패:', e);
          }
        }

        // npoint 코드 처리
        if (rawCode.startsWith('NP-')) {
          const npId = rawCode.replace('NP-', '');
          try {
            const res = await fetch(`https://api.npoint.io/${npId}`);
            if (res.ok) {
              const data = await res.json();
              return StorageService.importPayload(data);
            }
          } catch (e) {
            console.warn('npoint 다운로드 실패:', e);
          }
        }

        // Base64 직접 복원 시도
        const decodedStr = StorageService.decodeFromSafeBase64(rawCode);
        if (decodedStr) {
          try {
            const parsed = JSON.parse(decodedStr);
            return StorageService.importPayload(parsed);
          } catch (e) {}
        }

        return { success: false, error: '동기화 코드가 만료되었거나 올바르지 않습니다.' };
      },

      resetToDefaults: () => {

    // ==========================================
    // 3. 통계 계산 엔진
    // ==========================================
    const StatsCalculator = {
      calculateRoundStats: (round) => {
        if (!round || !round.holes || round.holes.length === 0) return null;
        const holes = round.holes.filter(h => h.score !== undefined && h.score !== null && h.score > 0);
        const totalHolesCount = holes.length;
        if (totalHolesCount === 0) return null;

        let totalScore = 0, totalPar = 0, totalPutts = 0, totalBunkers = 0, totalPenalties = 0;
        let fwEligibleCount = 0, fwHitCount = 0;
        const fwDistribution = { center: 0, left: 0, right: 0 };
        let girCount = 0, scramblingEligibleCount = 0, scramblingSuccessCount = 0;
        let onePuttCount = 0, twoPuttCount = 0, threePlusPuttCount = 0;
        const scoreDistribution = { albatross: 0, eagle: 0, birdie: 0, par: 0, bogey: 0, doubleBogey: 0, triplePlus: 0 };

        holes.forEach(hole => {
          const par = hole.par || 4;
          const score = hole.score;
          const putts = hole.putts !== undefined && hole.putts !== null ? hole.putts : 2;
          const diff = score - par;

          totalScore += score;
          totalPar += par;
          totalPutts += putts;
          totalBunkers += (hole.bunkerCount || 0);
          totalPenalties += (hole.penaltyCount || 0);

          if (diff <= -3) scoreDistribution.albatross++;
          else if (diff === -2) scoreDistribution.eagle++;
          else if (diff === -1) scoreDistribution.birdie++;
          else if (diff === 0) scoreDistribution.par++;
          else if (diff === 1) scoreDistribution.bogey++;
          else if (diff === 2) scoreDistribution.doubleBogey++;
          else scoreDistribution.triplePlus++;

          if (putts === 1) onePuttCount++;
          else if (putts === 2) twoPuttCount++;
          else if (putts >= 3) threePlusPuttCount++;

          if (par > 3) {
            fwEligibleCount++;
            const fw = (hole.fairway === 'left' || hole.fairway === 'right') ? hole.fairway : 'center';
            if (fwDistribution[fw] !== undefined) fwDistribution[fw]++;
            if (fw === 'center') fwHitCount++;
          }

          const isGir = hole.gir !== undefined ? hole.gir : ((score - putts) <= (par - 2));
          if (isGir) girCount++;
          else {
            scramblingEligibleCount++;
            if (score <= par) scramblingSuccessCount++;
          }
        });

        const fairwayHitPct = fwEligibleCount > 0 ? Math.round((fwHitCount / fwEligibleCount) * 100) : 0;
        const girPct = totalHolesCount > 0 ? Math.round((girCount / totalHolesCount) * 100) : 0;
        const avgPutts = totalHolesCount > 0 ? (totalPutts / totalHolesCount).toFixed(1) : '0.0';
        const noThreePuttPct = totalHolesCount > 0 ? Math.round(((totalHolesCount - threePlusPuttCount) / totalHolesCount) * 100) : 100;
        const scramblingPct = scramblingEligibleCount > 0 ? Math.round((scramblingSuccessCount / scramblingEligibleCount) * 100) : 0;

        const front9Holes = holes.slice(0, 9);
        const back9Holes = holes.slice(9, 18);
        const front9Score = front9Holes.reduce((sum, h) => sum + (h.score || 0), 0);
        const front9Par = front9Holes.reduce((sum, h) => sum + (h.par || 0), 0);
        const back9Score = back9Holes.reduce((sum, h) => sum + (h.score || 0), 0);
        const back9Par = back9Holes.reduce((sum, h) => sum + (h.par || 0), 0);
        const front9Bunkers = front9Holes.reduce((sum, h) => sum + (h.bunkerCount || 0), 0);
        const back9Bunkers = back9Holes.reduce((sum, h) => sum + (h.bunkerCount || 0), 0);
        const front9Penalties = front9Holes.reduce((sum, h) => sum + (h.penaltyCount || 0), 0);
        const back9Penalties = back9Holes.reduce((sum, h) => sum + (h.penaltyCount || 0), 0);

        return {
          totalScore, totalPar, overPar: totalScore - totalPar, totalHolesCount,
          front9Score, front9Par, front9Over: front9Score - front9Par,
          back9Score, back9Par, back9Over: back9Score - back9Par,
          fairwayHitPct, fwHitCount, fwEligibleCount, fwDistribution,
          girPct, girCount,
          totalPutts, avgPutts, onePuttCount, twoPuttCount, threePlusPuttCount, noThreePuttPct,
          scramblingPct, scramblingSuccessCount, scramblingEligibleCount,
          totalBunkers, totalPenalties, front9Bunkers, back9Bunkers, front9Penalties, back9Penalties,
          scoreDistribution
        };
      },

      calculateGlobalStats: (rounds) => {
        if (!rounds || rounds.length === 0) {
          return { 
            totalRounds: 0, avgScore: 0, bestScore: 0, 
            avgPutts: '0.0', avgFairwayPct: 0, avgGirPct: 0, avgThreePuttsPerRound: '0.0', 
            fwTotalCounts: { left: 0, center: 0, right: 0, total: 0 },
            fwPercentages: { left: 0, center: 0, right: 0 },
            scoreTrend: [], courseRankings: [] 
          };
        }
        const roundStatsList = rounds.map(r => ({ round: r, stats: StatsCalculator.calculateRoundStats(r) })).filter(i => i.stats !== null);
        if (roundStatsList.length === 0) {
          return { 
            totalRounds: 0, avgScore: 0, bestScore: 0, 
            avgPutts: '0.0', avgFairwayPct: 0, avgGirPct: 0, avgThreePuttsPerRound: '0.0', 
            fwTotalCounts: { left: 0, center: 0, right: 0, total: 0 },
            fwPercentages: { left: 0, center: 0, right: 0 },
            scoreTrend: [], courseRankings: [] 
          };
        }
        const totalRounds = roundStatsList.length;
        const scores = roundStatsList.map(item => item.stats.totalScore);
        const avgScore = Math.round((scores.reduce((a, b) => a + b, 0) / totalRounds) * 10) / 10;
        const bestScore = Math.min(...scores);

        const totalAvgPutts = roundStatsList.reduce((sum, item) => sum + parseFloat(item.stats.avgPutts), 0) / totalRounds;
        const totalFwPct = Math.round(roundStatsList.reduce((sum, item) => sum + item.stats.fairwayHitPct, 0) / totalRounds);
        const totalGirPct = Math.round(roundStatsList.reduce((sum, item) => sum + item.stats.girPct, 0) / totalRounds);
        const totalThreePutts = roundStatsList.reduce((sum, item) => sum + item.stats.threePlusPuttCount, 0);
        const avgThreePuttsPerRound = (totalThreePutts / totalRounds).toFixed(1);

        // 누적 페어웨이 방향별(왼쪽/적중/오른쪽) 총 합산 및 비율 계산
        let totalFwLeft = 0, totalFwCenter = 0, totalFwRight = 0, totalFwEligible = 0;
        roundStatsList.forEach(item => {
          if (item.stats.fwDistribution) {
            totalFwLeft += (item.stats.fwDistribution.left || 0);
            totalFwCenter += (item.stats.fwDistribution.center || 0);
            totalFwRight += (item.stats.fwDistribution.right || 0);
            totalFwEligible += (item.stats.fwEligibleCount || 0);
          }
        });

        const fwLeftPct = totalFwEligible > 0 ? Math.round((totalFwLeft / totalFwEligible) * 100) : 0;
        const fwCenterPct = totalFwEligible > 0 ? Math.round((totalFwCenter / totalFwEligible) * 100) : 0;
        const fwRightPct = totalFwEligible > 0 ? Math.round((totalFwRight / totalFwEligible) * 100) : 0;

        const scoreTrend = [...roundStatsList]
          .sort((a, b) => new Date(a.round.date).getTime() - new Date(b.round.date).getTime())
          .map(item => ({
            date: item.round.date,
            courseName: item.round.courseName,
            score: item.stats.totalScore,
            overPar: item.stats.overPar,
            putts: item.stats.totalPutts,
            fwPct: item.stats.fairwayHitPct,
            girPct: item.stats.girPct
          }));

        const courseMap = {};
        roundStatsList.forEach(item => {
          const cId = item.round.courseId || item.round.courseName;
          if (!courseMap[cId]) {
            courseMap[cId] = { courseId: cId, courseName: item.round.courseName, roundsCount: 0, scores: [], puttsList: [], fwList: [], girList: [] };
          }
          courseMap[cId].roundsCount++;
          courseMap[cId].scores.push(item.stats.totalScore);
          courseMap[cId].puttsList.push(parseFloat(item.stats.avgPutts));
          courseMap[cId].fwList.push(item.stats.fairwayHitPct);
          courseMap[cId].girList.push(item.stats.girPct);
        });

        const courseRankings = Object.values(courseMap).map(c => ({
          courseId: c.courseId,
          courseName: c.courseName,
          roundsCount: c.roundsCount,
          avgScore: Math.round((c.scores.reduce((a, b) => a + b, 0) / c.scores.length) * 10) / 10,
          bestScore: Math.min(...c.scores),
          avgPutts: (c.puttsList.reduce((a, b) => a + b, 0) / c.puttsList.length).toFixed(1),
          avgFwPct: Math.round(c.fwList.reduce((a, b) => a + b, 0) / c.fwList.length),
          avgGirPct: Math.round(c.girList.reduce((a, b) => a + b, 0) / c.girList.length)
        })).sort((a, b) => b.roundsCount - a.roundsCount || a.avgScore - b.avgScore);

        return { 
          totalRounds, avgScore, bestScore, 
          avgPutts: totalAvgPutts.toFixed(1), 
          avgFairwayPct: totalFwPct, 
          avgGirPct: totalGirPct, 
          avgThreePuttsPerRound, 
          fwTotalCounts: { left: totalFwLeft, center: totalFwCenter, right: totalFwRight, total: totalFwEligible },
          fwPercentages: { left: fwLeftPct, center: fwCenterPct, right: fwRightPct },
          scoreTrend, courseRankings 
        };
      },

      calculateCourseHoleStats: (rounds, targetCourseId, targetSubCourseId = null) => {
        const filteredRounds = rounds.filter(r => {
          if (targetCourseId && r.courseId !== targetCourseId && r.courseName !== targetCourseId) return false;
          return true;
        });

        const holeAccumulator = {};
        filteredRounds.forEach(round => {
          if (!round.holes) return;
          round.holes.forEach(hole => {
            if (!hole || hole.score === undefined || hole.score === null) return;
            const subId = hole.subCourseId || 'default';
            const subName = hole.subCourseName || '코스';
            const holeNum = hole.holeNumber;
            if (targetSubCourseId && subId !== targetSubCourseId) return;

            const key = `${subId}_H${holeNum}`;
            if (!holeAccumulator[key]) {
              holeAccumulator[key] = {
                subCourseId: subId, subCourseName: subName, holeNumber: holeNum,
                par: hole.par, handicap: hole.handicap, distance: hole.distance,
                playCount: 0, scores: [], putts: [], fwHits: 0, fwTotal: 0,
                fwCounts: { left: 0, center: 0, right: 0 },
                girHits: 0,
                bunkers: 0, penalties: 0,
                scoreCounts: { eagle: 0, birdie: 0, par: 0, bogey: 0, doubleBogey: 0, triplePlus: 0 }
              };
            }

            const hStat = holeAccumulator[key];
            hStat.playCount++;
            hStat.scores.push(hole.score);
            if (hole.putts !== undefined) hStat.putts.push(hole.putts);
            if (hole.par > 3) {
              hStat.fwTotal++;
              const fwDir = (hole.fairway === 'left' || hole.fairway === 'right') ? hole.fairway : 'center';
              hStat.fwCounts[fwDir]++;
              if (fwDir === 'center') hStat.fwHits++;
            }
            const isGir = hole.gir !== undefined ? hole.gir : ((hole.score - (hole.putts || 2)) <= (hole.par - 2));
            if (isGir) hStat.girHits++;
            hStat.bunkers += (hole.bunkerCount || 0);
            hStat.penalties += (hole.penaltyCount || 0);

            const diff = hole.score - hole.par;
            if (diff <= -2) hStat.scoreCounts.eagle++;
            else if (diff === -1) hStat.scoreCounts.birdie++;
            else if (diff === 0) hStat.scoreCounts.par++;
            else if (diff === 1) hStat.scoreCounts.bogey++;
            else if (diff === 2) hStat.scoreCounts.doubleBogey++;
            else hStat.scoreCounts.triplePlus++;
          });
        });

        return Object.values(holeAccumulator).map(h => {
          const avgScore = (h.scores.reduce((a, b) => a + b, 0) / h.playCount).toFixed(2);
          const avgPutts = h.putts.length > 0 ? (h.putts.reduce((a, b) => a + b, 0) / h.putts.length).toFixed(1) : '2.0';
          const avgOver = (parseFloat(avgScore) - h.par).toFixed(2);
          const fwPct = h.fwTotal > 0 ? Math.round((h.fwHits / h.fwTotal) * 100) : null;
          const girPct = Math.round((h.girHits / h.playCount) * 100);
          const parSavePct = Math.round(((h.scoreCounts.eagle + h.scoreCounts.birdie + h.scoreCounts.par) / h.playCount) * 100);

          return { ...h, avgScore: parseFloat(avgScore), avgOver: parseFloat(avgOver), avgPutts: parseFloat(avgPutts), fairwayHitPct: fwPct, girPct, parSavePct };
        }).sort((a, b) => (a.subCourseName !== b.subCourseName ? a.subCourseName.localeCompare(b.subCourseName) : a.holeNumber - b.holeNumber));
      }
    };

              <div class="space-y-1">
                <span class="text-[11px] text-slate-300 font-medium flex items-center gap-1">
                  <span class="w-2 h-2 rounded-full bg-emerald-500"></span> 전반 코스 (OUT 1~9번홀)
                </span>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
                  ${subCourses.map(sc => `
                    <button type="button" 
                            onclick="window.appActions.updateNewRoundDraft({ outCourseId: '${sc.id}' })"
                            class="p-2 rounded-xl border text-xs font-bold transition-all text-center ${
                              sc.id === outCourseId
                                ? 'bg-emerald-600 border-emerald-400 text-white shadow-md'
                                : 'bg-slate-800/80 border-slate-700 text-slate-300 hover:bg-slate-700'
                            }">
                      ${sc.name}
                      <div class="text-[9px] font-normal text-emerald-200/80">9홀 (Par ${sc.holes.reduce((sum, h) => sum + (h.par || 4), 0)})</div>
                    </button>
                  `).join('')}
                </div>
              </div>

              <div class="space-y-1 pt-1.5 border-t border-slate-800">
                <span class="text-[11px] text-slate-300 font-medium flex items-center gap-1">
                  <span class="w-2 h-2 rounded-full bg-teal-500"></span> 후반 코스 (IN 10~18번홀)
                </span>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
                  ${subCourses.map(sc => `
                    <button type="button" 
                            onclick="window.appActions.updateNewRoundDraft({ inCourseId: '${sc.id}' })"
                            class="p-2 rounded-xl border text-xs font-bold transition-all text-center ${
                              sc.id === inCourseId
                                ? 'bg-teal-600 border-teal-400 text-white shadow-md'
                                : 'bg-slate-800/80 border-slate-700 text-slate-300 hover:bg-slate-700'
                            }">
                      ${sc.name}
                      <div class="text-[9px] font-normal text-teal-200/80">9홀 (Par ${sc.holes.reduce((sum, h) => sum + (h.par || 4), 0)})</div>
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>
          ` : ''}

          <div class="glass-card p-3 rounded-2xl border border-slate-700/60 space-y-3">
            <label class="block text-xs font-bold text-emerald-400">
              3. 라운드 세부 설정
            </label>
            <div>
              <span class="text-[11px] text-slate-400 block mb-1">티잉 구역 (Tee Box)</span>
              <div class="flex flex-wrap gap-1.5">
                ${teeBoxes.map(t => `
                  <button type="button" 
                          onclick="window.appActions.updateNewRoundDraft({ teeBox: '${t}' })"
                          class="px-2.5 py-1 rounded-lg border text-xs font-semibold transition-all ${
                            t === teeBoxVal 
                              ? 'bg-slate-200 text-slate-950 border-white font-bold shadow' 
                              : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'
                          }">
                    ${t}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- 날짜 & 티오프 시간 (모바일 최적화 레이아웃) -->
            <div class="grid grid-cols-2 gap-2">
              <div class="min-w-0">
                <span class="text-[11px] text-slate-400 block mb-1 font-medium truncate">📅 라운드 날짜</span>
                <input type="date" value="${dateVal}" 
                       onchange="window.appActions.updateNewRoundDraft({ date: this.value })"
                       class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2 py-2 text-white text-xs font-bold focus:outline-none focus:border-emerald-500" />
              </div>
              <div class="min-w-0">
                <span class="text-[11px] text-slate-400 block mb-1 font-medium truncate">⏰ 티오프 시간</span>
                <div class="flex items-center gap-1">
                  <select onchange="window.appActions.updateTeeOffHour(this.value)"
                          class="w-1/2 bg-slate-800 border border-slate-700 rounded-xl px-1.5 py-2 text-white text-xs font-bold focus:outline-none focus:border-emerald-500 text-center">
                    ${hoursList.map(h => `
                      <option value="${h}" ${curHour === h ? 'selected' : ''}>${h}시</option>
                    `).join('')}
                  </select>
                  <span class="text-xs text-slate-400 font-bold">:</span>
                  <select onchange="window.appActions.updateTeeOffMinute(this.value)"
                          class="w-1/2 bg-slate-800 border border-slate-700 rounded-xl px-1.5 py-2 text-white text-xs font-bold focus:outline-none focus:border-emerald-500 text-center">
                    ${minutesList.map(m => `
                      <option value="${m}" ${curMinute === m ? 'selected' : ''}>${m}분</option>
                    `).join('')}
                  </select>
                </div>
              </div>
            </div>

            <div>
              <span class="text-[11px] text-slate-400 block mb-1">동반자 또는 목표 메모</span>
              <input type="text" value="${memoVal}" placeholder="예: 오늘 80타 목표, 동반자 이름"
                     oninput="window.appActions.updateNewRoundDraft({ memo: this.value })"
                     class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2 text-white text-xs focus:outline-none focus:border-emerald-500" />
            </div>
          </div>

          <button onclick="window.appActions.startRoundFromDraft()"
                  class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black rounded-2xl text-base shadow-xl transition-all active:scale-[0.98] flex items-center justify-center gap-2">
            <span>🚀</span> ${state.currentUser} 님의 라운드 시작
          </button>
        </div>
      `;
    }

    function renderRoundLiveView() {
      const round = state.activeRound;
      if (!round) {
        return `
          <div class="p-8 text-center text-slate-400">
            <p>진행 중인 라운드가 없습니다.</p>
            <button onclick="window.appActions.navigate('home')" class="mt-4 px-4 py-2 bg-emerald-600 text-white rounded-xl font-bold">
              홈으로 돌아가기
            </button>
          </div>
        `;
      }

      const currentHoleIndex = state.currentHoleIndex !== undefined ? state.currentHoleIndex : 0;
      const currentHole = round.holes[currentHoleIndex] || round.holes[0];
      const par = currentHole.par || 4;
      const score = currentHole.score !== undefined ? currentHole.score : par;
      const putts = currentHole.putts !== undefined ? currentHole.putts : 2;
      const fairway = currentHole.fairway || (par === 3 ? 'none' : 'center');
      const gir = currentHole.gir !== undefined ? currentHole.gir : ((score - putts) <= (par - 2));
      const bunkerCount = currentHole.bunkerCount || 0;
      const penaltyCount = currentHole.penaltyCount || 0;
      const holeMemo = currentHole.memo || '';

      const diff = score - par;
      let scoreLabel = 'PAR (파)';
      let scoreColorClass = 'text-emerald-400 border-emerald-500/50 bg-emerald-950/40';
      let diffBigText = '0';

      if (diff <= -3) {
        scoreLabel = 'ALBATROSS (알바트로스)'; scoreColorClass = 'text-purple-300 border-purple-500/50 bg-purple-950/50'; diffBigText = `${diff}`;
      } else if (diff === -2) {
        scoreLabel = 'EAGLE (이글)'; scoreColorClass = 'text-amber-300 border-amber-500/50 bg-amber-950/50'; diffBigText = '-2';
      } else if (diff === -1) {
        scoreLabel = 'BIRDIE (버디)'; scoreColorClass = 'text-rose-400 border-rose-500/50 bg-rose-950/50'; diffBigText = '-1';
      } else if (diff === 0) {
        scoreLabel = 'PAR (파)'; scoreColorClass = 'text-emerald-400 border-emerald-500/50 bg-emerald-950/40'; diffBigText = '0';
      } else if (diff === 1) {
        scoreLabel = 'BOGEY (보기)'; scoreColorClass = 'text-blue-400 border-blue-500/50 bg-blue-950/40'; diffBigText = '+1';
      } else if (diff === 2) {
        scoreLabel = 'DOUBLE (더블보기)'; scoreColorClass = 'text-indigo-400 border-indigo-500/50 bg-indigo-950/40'; diffBigText = '+2';
      } else if (diff === 3) {
        scoreLabel = 'TRIPLE (트리플보기)'; scoreColorClass = 'text-slate-300 border-slate-600 bg-slate-800/60'; diffBigText = '+3';
      } else {
        scoreLabel = `+${diff} BOGEY`; scoreColorClass = 'text-slate-400 border-slate-700 bg-slate-900/60'; diffBigText = `+${diff}`;
      }

      const totalScoreSoFar = round.holes.reduce((sum, h) => sum + (h.score || 0), 0);
      const totalParSoFar = round.holes.reduce((sum, h) => sum + (h.par || 4), 0);
      const totalDiffSoFar = totalScoreSoFar - totalParSoFar;
      const totalDiffText = totalDiffSoFar === 0 ? '0 (이븐)' : (totalDiffSoFar > 0 ? `+${totalDiffSoFar}` : `${totalDiffSoFar}`);
      const playedHolesCount = round.holes.filter(h => h.score > 0).length;

      const activeTab = state.roundHoleViewTab || (currentHoleIndex < 9 ? 'front' : 'back');
      
      let displayedHolesWithIndices = [];
      if (activeTab === 'front') {
        displayedHolesWithIndices = round.holes.slice(0, 9).map((h, i) => ({ hole: h, index: i }));
      } else if (activeTab === 'back') {
        displayedHolesWithIndices = round.holes.slice(9, 18).map((h, i) => ({ hole: h, index: i + 9 }));
      } else {
        displayedHolesWithIndices = round.holes.map((h, i) => ({ hole: h, index: i }));
      }

      return `
        <div class="p-3.5 space-y-3 animate-fade-in pb-16">
          <!-- 1. 상단 전반/후반 코스 선택 탭 & 홀 네비게이터 -->
          <div class="glass-card p-2.5 rounded-2xl border border-slate-700/60 shadow-lg space-y-2">
            <div class="grid grid-cols-3 gap-1.5 p-1 bg-slate-900 rounded-xl border border-slate-800">
              <button onclick="window.appActions.setRoundHoleViewTab('front')"
                      class="py-1.5 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1 ${
                        activeTab === 'front'
                          ? 'bg-emerald-600 text-white shadow'
                          : 'text-slate-400 hover:text-slate-200'
                      }">
                <span>⛳</span> 전반 OUT (1~9)
              </button>

              <button onclick="window.appActions.setRoundHoleViewTab('back')"
                      class="py-1.5 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1 ${
                        activeTab === 'back'
                          ? 'bg-teal-600 text-white shadow'
                          : 'text-slate-400 hover:text-slate-200'
                      }">
                <span>⛳</span> 후반 IN (10~18)
              </button>

              <button onclick="window.appActions.setRoundHoleViewTab('all')"
                      class="py-1.5 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1 ${
                        activeTab === 'all'
                          ? 'bg-slate-700 text-white shadow'
                          : 'text-slate-400 hover:text-slate-200'
                      }">
                <span>전체 18홀</span>
              </button>
            </div>

            <div class="flex items-center justify-between px-1 text-[11px] text-slate-400">
              <span class="font-semibold text-white truncate max-w-[65%]">
                ${activeTab === 'front' ? `[전반] ${round.outCourseName}` : (activeTab === 'back' ? `[후반] ${round.inCourseName}` : '18홀 전체')}
              </span>
              <span class="text-emerald-400 font-bold">누적: <strong class="text-white">${totalDiffText}</strong> (${playedHolesCount}/18)</span>
            </div>

            <!-- 홀 버튼 그리드 -->
            <div class="grid ${activeTab === 'all' ? 'grid-cols-6 sm:grid-cols-9' : 'grid-cols-9'} gap-1 pt-0.5">
              ${displayedHolesWithIndices.map(item => {
                const idx = item.index;
                const h = item.hole;
                const isSelected = idx === currentHoleIndex;
                const hScore = h.score;
                const hPar = h.par || 4;
                const hDiff = hScore !== undefined ? hScore - hPar : null;

                let badgeBg = 'bg-slate-800 text-slate-400';
                let badgeText = `P${hPar}`;
                if (hDiff !== null) {
                  if (hDiff < 0) { badgeBg = 'bg-rose-500 text-white font-black'; badgeText = `${hDiff}`; }
                  else if (hDiff === 0) { badgeBg = 'bg-emerald-600 text-white font-black'; badgeText = '0'; }
                  else if (hDiff === 1) { badgeBg = 'bg-blue-600 text-white font-black'; badgeText = '+1'; }
                  else if (hDiff === 2) { badgeBg = 'bg-indigo-600 text-white font-black'; badgeText = '+2'; }
                  else { badgeBg = 'bg-slate-600 text-white font-black'; badgeText = `+${hDiff}`; }
                }

                return `
                  <button onclick="window.appActions.setCurrentHole(${idx})"
                          class="py-1.5 rounded-xl border text-center transition-all ${
                            isSelected 
                              ? 'border-emerald-400 bg-emerald-950/90 ring-2 ring-emerald-500/50' 
                              : 'border-slate-800 bg-slate-900/70 hover:bg-slate-800'
                          }">
                    <div class="text-[10px] ${isSelected ? 'text-emerald-300 font-black' : 'text-slate-400'}">
                      ${h.holeNumber}H
                    </div>
                    <div class="text-xs font-black my-0.5 ${badgeBg} rounded-md mx-0.5 py-0.5">
                      ${badgeText}
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 2. 현재 홀 상세 정보 및 빠른 Par 수정 바 -->
          <div class="glass-card p-3.5 rounded-2xl border border-slate-700/60 bg-gradient-to-r from-slate-900 via-slate-850 to-slate-900 shadow-md">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 rounded-lg ${currentHoleIndex < 9 ? 'bg-emerald-600/90' : 'bg-teal-600/90'} text-white font-black text-sm shadow">
                  ${currentHoleIndex < 9 ? 'OUT' : 'IN'} ${currentHole.holeNumber}번홀
                </span>
                <div>
                  <h3 class="text-sm font-bold text-white leading-tight">
                    ${currentHole.subCourseName || '코스'}
                  </h3>
                  <span class="text-[11px] text-amber-300 font-medium">핸디캡(HDCP) ${currentHole.handicap || '-'}</span>
                </div>
              </div>

              <div class="text-right">
                <div class="text-[10px] text-slate-400 font-medium mb-1">기준 파(Par) 변경</div>
                <div class="flex items-center gap-1">
                  ${[3, 4, 5, 6].map(pVal => `
                    <button onclick="window.appActions.changeCurrentHolePar(${pVal})"
                            class="px-2 py-0.5 rounded text-xs font-black transition-all ${
                              par === pVal
                                ? 'bg-emerald-500 text-slate-950 font-black shadow ring-1 ring-white'
                                : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                            }">
                      P${pVal}
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>

          <!-- 3. 대형 스코어 입력 섹션 -->
          <div class="glass-card p-4 rounded-2xl border ${scoreColorClass} shadow-xl relative">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">
                홀 스코어
              </span>
              <span class="text-xs font-black px-2.5 py-0.5 rounded-full border ${scoreColorClass}">
                ${scoreLabel}
              </span>
            </div>

            <div class="flex items-center justify-between py-1">
              <button onclick="window.appActions.adjustHoleScore(-1)"
                      class="w-14 h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-2xl font-bold text-slate-200 border border-slate-700 flex items-center justify-center shadow-md">
                －
              </button>

              <div class="text-center cursor-pointer" onclick="window.appActions.promptExactScore()">
                <div class="text-6xl font-black text-white tracking-tight leading-none">
                  ${diffBigText}
                </div>
                <div class="text-xs text-emerald-300 mt-1 font-bold">
                  총 ${score}타 <span class="text-slate-400 font-normal">(PAR ${par} 기준)</span>
                </div>
              </div>

              <button onclick="window.appActions.adjustHoleScore(1)"
                      class="w-14 h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-2xl font-bold text-slate-200 border border-slate-700 flex items-center justify-center shadow-md">
                ＋
              </button>
            </div>

            <div class="grid grid-cols-5 gap-1.5 mt-3 pt-3 border-t border-slate-800/80">
              ${[
                { name: '버디', diffText: '-1', scoreVal: par - 1, color: 'bg-rose-600/90 hover:bg-rose-500' },
                { name: '파 (0)', diffText: '0', scoreVal: par, color: 'bg-emerald-600/90 hover:bg-emerald-500' },
                { name: '보기', diffText: '+1', scoreVal: par + 1, color: 'bg-blue-600/90 hover:bg-blue-500' },
                { name: '더블', diffText: '+2', scoreVal: par + 2, color: 'bg-indigo-600/90 hover:bg-indigo-500' },
                { name: '트리플', diffText: '+3', scoreVal: par + 3, color: 'bg-slate-700 hover:bg-slate-600' }
              ].map(p => `
                <button onclick="window.appActions.setHoleScore(${p.scoreVal})"
                        class="py-2.5 rounded-xl text-center transition-all ${
                          score === p.scoreVal ? 'ring-2 ring-white scale-105 shadow-lg' : 'opacity-85'
                        } ${p.color}">
                  <div class="text-sm font-black text-white leading-none">${p.diffText}</div>
                  <div class="text-[10px] text-white/90 font-medium mt-0.5">${p.name}</div>
                </button>
              `).join('')}
            </div>
          </div>

          <!-- 4. 티샷 방향 선택기 (파4, 파5 홀 전용) -->
          ${par > 3 ? `
            <div class="glass-card p-3.5 rounded-2xl border border-slate-700/60 shadow-md">
              <div class="flex items-center justify-between mb-2">
                <label class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
                  <span>🎯</span> 티샷 방향
                </label>
                <span class="text-[11px] font-semibold text-emerald-400">
                  ${fairway === 'center' ? '🎯 페어웨이 안착' : (fairway === 'left' ? '← 좌측 미스' : '→ 우측 미스')}
                </span>
              </div>

              <div class="grid grid-cols-3 gap-2">
                <button onclick="window.appActions.setHoleFairway('left')"
                        class="fw-btn py-3 px-2 rounded-xl border text-xs font-bold flex items-center justify-center gap-1.5 ${
                          fairway === 'left' ? 'active' : 'bg-slate-800 border-slate-700 text-slate-300'
                        }">
                  <span class="text-lg font-bold text-slate-400">←</span>
                  <span>좌측 미스</span>
                </button>

                <button onclick="window.appActions.setHoleFairway('center')"
                        class="fw-btn py-3 px-2 rounded-xl border text-xs font-black flex items-center justify-center gap-1.5 ${
                          fairway === 'center' || fairway === 'none' ? 'active' : 'bg-slate-800 border-slate-700 text-emerald-400'
                        }">
                  <span class="text-lg font-black leading-none">◎</span>
                  <span>페어웨이</span>
                </button>

                <button onclick="window.appActions.setHoleFairway('right')"
                        class="fw-btn py-3 px-2 rounded-xl border text-xs font-bold flex items-center justify-center gap-1.5 ${
                          fairway === 'right' ? 'active' : 'bg-slate-800 border-slate-700 text-slate-300'
                        }">
                  <span class="text-lg font-bold text-slate-400">→</span>
                  <span>우측 미스</span>
                </button>
              </div>
            </div>
          ` : `
            <div class="px-2 py-1 flex items-center justify-between text-[11px] text-slate-500">
              <span>⛳ 파3 홀 (티샷 생략)</span>
              <span>GIR: ${gir ? '🟢 온그린' : '⚪ 온그린 실패'}</span>
            </div>
          `}

          <!-- 5. 퍼팅 수 & GIR 상태 -->
          <div class="glass-card p-3.5 rounded-2xl border border-slate-700/60 shadow-md space-y-2.5">
            <div class="flex items-center justify-between">
              <label class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
                <span>⛳</span> 퍼팅 수 (Putts)
              </label>
              <div class="text-xs font-bold ${gir ? 'text-emerald-400' : 'text-slate-400'} flex items-center gap-1">
                <span>${gir ? '🟢' : '⚪'}</span>
                <span>${gir ? '그린 적중 (GIR)' : '그린 미스'}</span>
              </div>
            </div>

            <div class="grid grid-cols-5 gap-2">
              ${[0, 1, 2, 3, 4].map(pNum => `
                <button onclick="window.appActions.setHolePutts(${pNum})"
                        class="py-2.5 rounded-xl border text-base font-black transition-all ${
                          putts === pNum
                            ? (pNum >= 3 ? 'bg-amber-600 border-amber-400 text-white shadow-lg scale-105' : 'bg-emerald-600 border-emerald-400 text-white shadow-lg scale-105')
                            : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'
                        }">
                  ${pNum === 4 ? '4+' : `${pNum}펏`}
                </button>
              `).join('')}
            </div>
          </div>

          <!-- 6. 벙커 & 벌타 카운터 -->
          <div class="grid grid-cols-2 gap-2.5">
            <div class="glass-card p-3 rounded-2xl border border-slate-700/60 flex items-center justify-between">
              <div>
                <div class="text-xs font-bold text-amber-400 flex items-center gap-1">
                  <span>🏖️</span> 벙커
                </div>
                <div class="text-[10px] text-slate-400">벙커샷 횟수</div>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="window.appActions.adjustHoleBunker(-1)"
                        class="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 font-bold hover:bg-slate-700">-</button>
                <span class="w-6 text-center font-bold text-sm text-white">${bunkerCount}</span>
                <button onclick="window.appActions.adjustHoleBunker(1)"
                        class="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 font-bold hover:bg-slate-700">+</button>
              </div>
            </div>

            <div class="glass-card p-3 rounded-2xl border border-slate-700/60 flex items-center justify-between">
              <div>
                <div class="text-xs font-bold text-rose-400 flex items-center gap-1">
                  <span>⚠️</span> 벌타
                </div>
                <div class="text-[10px] text-slate-400">OB/해저드</div>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="window.appActions.adjustHolePenalty(-1)"
                        class="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 font-bold hover:bg-slate-700">-</button>
                <span class="w-6 text-center font-bold text-sm text-white">${penaltyCount}</span>
                <button onclick="window.appActions.adjustHolePenalty(1)"
                        class="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 font-bold hover:bg-slate-700">+</button>
              </div>
            </div>
          </div>

          <!-- 7. 홀 간단 메모 입력창 -->
          <div class="glass-card p-3 rounded-2xl border border-slate-700/60">
            <input type="text" value="${holeMemo}" placeholder="📝 홀 메모 (예: 드라이버 굿샷, 7번 아이언 핀 우측 2m)"
                   oninput="window.appActions.updateHoleMemo(this.value)"
                   class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs placeholder-slate-500 focus:outline-none focus:border-emerald-500" />
          </div>

          <!-- 8. 하단 빠른 홀 전환 및 스코어카드 액션 바 -->
          <div class="flex items-center gap-2 pt-1">
            <button onclick="window.appActions.prevHole()" ${currentHoleIndex === 0 ? 'disabled' : ''}
                    class="px-4 py-3.5 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-slate-200 font-bold text-xs shadow">
              ◀ 이전
            </button>

            <button onclick="window.appActions.openScorecardModal()"
                    class="flex-1 py-3.5 rounded-xl border border-slate-700 bg-slate-800/90 hover:bg-slate-700 text-emerald-400 font-bold text-xs flex items-center justify-center gap-1.5 shadow">
              <span>📊</span> 스코어카드 (${totalDiffText})
            </button>

            ${currentHoleIndex < 17 ? `
              <button onclick="window.appActions.nextHole()"
                      class="px-5 py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs shadow-lg flex items-center gap-1 active:scale-95">
                <span>다음</span> <span>▶</span>
              </button>
            ` : `
              <button onclick="window.appActions.finishRound()"
                      class="px-5 py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-black text-xs shadow-lg flex items-center gap-1 animate-pulse">
                <span>🏁 종료</span>
              </button>
            `}
          </div>
        </div>
      `;
    }

    // ==========================================
    // 스코어카드 팝업 렌더러
    // ==========================================
    function renderScorecardModal() {
      const round = state.activeRound || state.selectedRoundDetail;
      if (!round) return '';

      const isCompletedRound = !state.activeRound;
      const holes = round.holes || [];
      const front9 = holes.slice(0, 9);
      const back9 = holes.slice(9, 18);

      const renderNineHoleTable = (nineHoles, title, startIndex) => {
        const totalPar = nineHoles.reduce((s, h) => s + (h.par || 0), 0);
        const totalScore = nineHoles.reduce((s, h) => s + (h.score || 0), 0);
        const totalPutts = nineHoles.reduce((s, h) => s + (h.putts || 0), 0);
        const diff = totalScore > 0 ? totalScore - totalPar : 0;
        const diffSign = diff === 0 ? '0 (이븐)' : (diff > 0 ? `+${diff}` : `${diff}`);

        return `
          <div class="mb-4">
            <div class="flex items-center justify-between text-xs font-bold text-slate-300 mb-1 px-1">
              <span class="text-emerald-400">${title}</span>
              <span>합계: <strong class="text-white text-sm">${diffSign}</strong> (${totalScore}타 / ${totalPutts}펏)</span>
            </div>
            <div class="overflow-x-auto border border-slate-700/80 rounded-xl bg-slate-900/80 shadow-md">
              <table class="scorecard-table">
                <thead>
                  <tr>
                    <th class="w-14 text-[11px]">항목</th>
                    ${nineHoles.map((h, i) => `
                      <th onclick="window.appActions.onScorecardHoleClick(${startIndex + i})"
                          class="cursor-pointer hover:bg-slate-800 transition-colors text-white font-bold" title="탭하여 ${startIndex + i + 1}번홀 수정">
                        ${i + 1}
                      </th>
                    `).join('')}
                    <th class="bg-slate-800 text-white font-bold w-12">합계</th>
                  </tr>
                </thead>
                <tbody>
                  <tr class="text-slate-400">
                    <td class="font-medium bg-slate-850 text-slate-400">PAR</td>
                    ${nineHoles.map(h => `<td class="text-slate-300 font-semibold">${h.par || '-'}</td>`).join('')}
                    <td class="font-bold text-slate-300 bg-slate-850">${totalPar}</td>
                  </tr>

                  <tr class="text-[11px] text-amber-400/90 font-medium">
                    <td class="bg-slate-850 text-amber-400 font-bold">HDCP</td>
                    ${nineHoles.map(h => `<td class="text-amber-300/80 font-mono font-bold">${h.handicap || h.hdcp || '-'}</td>`).join('')}
                    <td class="bg-slate-850 text-slate-500 font-mono">-</td>
                  </tr>

                  <tr class="font-black text-white">
                    <td class="bg-slate-850 text-emerald-400 font-bold">스코어</td>
                    ${nineHoles.map((h, i) => {
                      const hScore = h.score;
                      const hPar = h.par || 4;
                      const hDiff = hScore !== undefined ? hScore - hPar : null;
                      let bg = 'bg-slate-800 text-slate-400';
                      let cellText = '-';
                      if (hDiff !== null) {
                        if (hDiff <= -2) { bg = 'bg-amber-500 text-slate-950 font-black rounded px-1'; cellText = `${hDiff}`; }
                        else if (hDiff === -1) { bg = 'bg-rose-500 text-white rounded px-1'; cellText = '-1'; }
                        else if (hDiff === 0) { bg = 'bg-emerald-600/80 text-white rounded px-1'; cellText = '0'; }
                        else if (hDiff === 1) { bg = 'bg-blue-600/80 text-white rounded px-1'; cellText = '+1'; }
                        else if (hDiff >= 2) { bg = 'bg-slate-700 text-slate-200 rounded px-1'; cellText = `+${hDiff}`; }
                      }
                      return `
                        <td onclick="window.appActions.onScorecardHoleClick(${startIndex + i})" 
                            class="cursor-pointer hover:bg-slate-800 hover:ring-1 hover:ring-emerald-400 transition-all">
                          <span class="inline-block py-0.5 ${bg}">${cellText}</span>
                        </td>
                      `;
                    }).join('')}
                    <td class="font-black text-emerald-400 bg-slate-850 text-xs">${diffSign}</td>
                  </tr>

                  <tr class="text-[11px] text-amber-300">
                    <td class="bg-slate-850 text-amber-400/90 font-medium">퍼트</td>
                    ${nineHoles.map(h => `<td>${h.putts !== undefined ? h.putts : '-'}</td>`).join('')}
                    <td class="font-bold bg-slate-850">${totalPutts}</td>
                  </tr>

                  <tr class="text-[11px]">
                    <td class="bg-slate-850 text-emerald-400 font-bold">FW</td>
                    ${nineHoles.map(h => {
                      if (h.par === 3) return `<td class="text-slate-600 font-bold">-</td>`;
                      const fw = h.fairway || 'center';
                      const fwSym = fw === 'left' ? '<span class="text-slate-400 font-bold text-sm">←</span>' : (fw === 'right' ? '<span class="text-slate-400 font-bold text-sm">→</span>' : '<span class="text-emerald-400 font-black text-sm">◎</span>');
                      const title = fw === 'left' ? '좌측 미스' : (fw === 'right' ? '우측 미스' : '페어웨이 안착');
                      return `<td title="${title}">${fwSym}</td>`;
                    }).join('')}
                    <td class="bg-slate-850 text-[10px] text-emerald-400 font-bold">
                      ${nineHoles.filter(h => h.par > 3 && (h.fairway === 'center' || !h.fairway)).length}/${nineHoles.filter(h => h.par > 3).length}
                    </td>
                  </tr>

                  <tr class="text-[11px]">
                    <td class="bg-slate-850 text-sky-400 font-bold">GIR</td>
                    ${nineHoles.map(h => {
                      const isGir = h.gir !== undefined ? h.gir : ((h.score - (h.putts || 2)) <= (h.par - 2));
                      return `<td><span class="text-xs">${isGir ? '🟢' : '⚪'}</span></td>`;
                    }).join('')}
                    <td class="bg-slate-850 text-[10px] text-sky-400 font-bold">
                      ${nineHoles.filter(h => h.gir !== undefined ? h.gir : ((h.score - (h.putts || 2)) <= (h.par - 2))).length}/9
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        `;
      };

      const total18Score = holes.reduce((s, h) => s + (h.score || 0), 0);
      const total18Par = holes.reduce((s, h) => s + (h.par || 0), 0);
      const total18Putts = holes.reduce((s, h) => s + (h.putts || 0), 0);
      const totalDiff = total18Score - total18Par;
      const totalDiffSign = totalDiff === 0 ? '0 (이븐)' : (totalDiff > 0 ? `+${totalDiff}` : `${totalDiff}`);

      return `
        <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-3 animate-fade-in"
             onclick="if(event.target === this) window.appActions.closeScorecardModal()">
          <div class="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-lg max-h-[92vh] overflow-y-auto p-4 shadow-2xl space-y-3">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
              <div>
                <h3 class="text-base font-bold text-white flex items-center gap-1.5">
                  <span>📊</span> ${round.courseName} 스코어카드
                </h3>
                <p class="text-xs text-slate-400">
                  플레이어: <strong class="text-emerald-400">${round.playerName || state.currentUser}</strong> • ${round.outCourseName || '전반'} / ${round.inCourseName || '후반'} (${round.date || '오늘'})
                </p>
              </div>
              <button onclick="window.appActions.closeScorecardModal()"
                      class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-bold flex items-center justify-center">
                ✕
              </button>
            </div>

            <div class="bg-gradient-to-r from-emerald-950 to-teal-950 border border-emerald-500/40 rounded-2xl p-3 flex items-center justify-around text-center">
              <div>
                <div class="text-[11px] text-emerald-300 font-medium">최종 스코어</div>
                <div class="text-2xl font-black text-white">${totalDiffSign}</div>
                <div class="text-xs font-bold text-slate-400">총 ${total18Score}타 (기준 Par ${total18Par})</div>
              </div>
              <div class="h-8 w-px bg-slate-700"></div>
              <div>
                <div class="text-[11px] text-amber-300 font-medium">총 퍼팅수</div>
                <div class="text-2xl font-black text-amber-400">${total18Putts}펏</div>
                <div class="text-[10px] text-slate-400">홀당 ${(total18Putts / Math.max(holes.filter(h => h.score > 0).length, 1)).toFixed(1)}펏</div>
              </div>
            </div>

            ${renderNineHoleTable(front9, `전반: ${round.outCourseName || 'OUT 코스'}`, 0)}
            ${renderNineHoleTable(back9, `후반: ${round.inCourseName || 'IN 코스'}`, 9)}

            <div class="text-[11px] text-emerald-300 bg-emerald-950/40 border border-emerald-800/60 rounded-xl p-2.5 text-center">
              👉 <strong>홀 번호나 스코어 셀을 탭하면</strong> 해당 홀의 입력/수정 화면으로 즉시 이동합니다!
            </div>

            <div class="flex gap-2">
              ${isCompletedRound ? `
                <button onclick="window.appActions.startEditingCompletedRound('${round.id}')"
                        class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs shadow-md flex items-center justify-center gap-1.5">
                  <span>✏️</span> 이 라운드 전체 수정 모드 열기
                </button>
              ` : ''}
              <button onclick="window.appActions.closeScorecardModal()"
                      class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs transition-all">
                닫기
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderRoundSummaryView() {
      const round = state.summaryRound || (state.rounds && state.rounds[0]);
      if (!round) {
        return `
          <div class="p-8 text-center text-slate-400">
            <p>표시할 라운드 기록이 없습니다.</p>
            <button onclick="window.appActions.navigate('home')" class="mt-4 px-4 py-2 bg-emerald-600 text-white rounded-xl font-bold">
              홈으로 가기
            </button>
          </div>
        `;
      }

      const stats = StatsCalculator.calculateRoundStats(round);
      const totalScore = round.totalScore || 72;
      const overPar = round.overPar !== undefined ? round.overPar : (totalScore - (round.totalPar || 72));
      const overParSign = overPar === 0 ? '0 (이븐)' : (overPar > 0 ? `+${overPar}` : `${overPar}`);

      return `
        <div class="p-4 space-y-4 animate-fade-in pb-16">
          <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-800 via-teal-900 to-slate-900 p-5 shadow-2xl border border-emerald-500/40 text-center">
            <div class="inline-block px-3 py-1 rounded-full bg-emerald-950/80 border border-emerald-400/40 text-emerald-300 text-xs font-bold mb-2">

            </div>

            <h2 class="text-xl font-black text-white">
              ${round.courseName}
            </h2>
            <p class="text-xs text-emerald-200/80 mb-4">
              ${round.outCourseName} / ${round.inCourseName} • ${round.date}${round.teeOffTime ? ` ${round.teeOffTime} 티오프` : ''} • ${round.teeBox || '화이트'}
            </p>

            <div class="bg-slate-950/60 rounded-2xl p-4 border border-emerald-500/30 max-w-xs mx-auto mb-3">
              <div class="text-xs text-slate-400 font-semibold mb-1">최종 스코어</div>
              <div class="text-5xl font-black ${overPar > 0 ? 'text-amber-400' : 'text-emerald-400'} tracking-tight leading-none">
                ${overParSign}
              </div>
              <div class="text-xs text-slate-300 mt-1 font-bold">
                총 ${totalScore}타 (Par ${round.totalPar || 72})
              </div>
              <div class="flex items-center justify-center gap-4 mt-3 pt-2.5 border-t border-slate-800 text-xs text-slate-300">
                <span>전반: <strong class="text-white">${stats ? (stats.front9Over > 0 ? `+${stats.front9Over}` : (stats.front9Over === 0 ? '0' : stats.front9Over)) : '-'} (${stats ? stats.front9Score : '-'}타)</strong></span>
                <span>|</span>
                <span>후반: <strong class="text-white">${stats ? (stats.back9Over > 0 ? `+${stats.back9Over}` : (stats.back9Over === 0 ? '0' : stats.back9Over)) : '-'} (${stats ? stats.back9Score : '-'}타)</strong></span>
              </div>
            </div>

            ${round.memo ? `
              <div class="text-xs bg-slate-900/60 rounded-xl p-2.5 text-slate-300 text-left border border-slate-800">
                <span class="font-bold text-emerald-400">📝 메모:</span> ${round.memo}
              </div>
            ` : ''}
          </div>

          ${stats ? `
            <div class="grid grid-cols-2 gap-2.5">
              <div class="glass-card p-3.5 rounded-2xl border border-slate-700/60">
                <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
                  <span>◎ FW 안착 (파4/5)</span>
                  <span class="text-[10px] text-emerald-400 font-bold">${stats.fwHitCount}/${stats.fwEligibleCount}홀</span>
                </div>
                <div class="text-2xl font-black text-emerald-400">
                  ${stats.fairwayHitPct}%
                </div>
                <div class="text-[10px] text-slate-300 mt-1 font-medium">
                  ← ${stats.fwDistribution.left}회 • ◎ ${stats.fwDistribution.center}회 • → ${stats.fwDistribution.right}회
                </div>
              </div>

              <div class="glass-card p-3.5 rounded-2xl border border-slate-700/60">
                <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
                  <span>🟢 그린 적중률 (GIR)</span>
                  <span class="text-[10px] text-sky-400 font-bold">${stats.girCount}/${stats.totalHolesCount}홀</span>
                </div>
                <div class="text-2xl font-black text-sky-400">
                  ${stats.girPct}%
                </div>
                <div class="text-[10px] text-slate-400 mt-1">
                  스크램블링(파세이브) ${stats.scramblingPct}%
                </div>
              </div>

              <div class="glass-card p-3.5 rounded-2xl border border-slate-700/60">
                <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
                  <span>⛳ 퍼팅 분석</span>
                  <span class="text-[10px] text-amber-400 font-bold">홀당 ${stats.avgPutts}펏</span>
                </div>
                <div class="text-2xl font-black text-amber-400">
                  ${stats.totalPutts}<span class="text-xs font-normal text-slate-400 ml-1">총 퍼트</span>
                </div>
                <div class="text-[10px] text-slate-400 mt-1">
                  1펏: ${stats.onePuttCount}회 • 3펏+: <strong class="${stats.threePlusPuttCount > 0 ? 'text-amber-300' : 'text-emerald-300'}">${stats.threePlusPuttCount}회</strong>
                </div>

              <div class="glass-card p-3.5 rounded-2xl border border-slate-700/60">
                <div class="flex items-center justify-between text-xs text-slate-400 mb-1">

                  <span class="text-[10px] text-slate-400 font-bold">벌타 / 벙커</span>
                </div>
                <div class="flex items-baseline justify-between">
                  <div class="text-2xl font-black text-rose-400">
                    ${stats.totalPenalties}<span class="text-xs font-normal text-slate-400 ml-1">벌타</span>
                  </div>
                  <div class="text-[10px] text-slate-400 font-medium">
                    전반 ${stats.front9Penalties} • 후반 ${stats.back9Penalties}
                  </div>
                </div>
                <div class="flex items-center justify-between text-[10px] text-slate-300 mt-1 pt-1 border-t border-slate-800/80">
                  <span>벙커 탈출: <strong class="text-amber-400">${stats.totalBunkers}회</strong></span>
                  <span class="text-slate-400 font-medium">전반 ${stats.front9Bunkers} • 후반 ${stats.back9Bunkers}</span>
                </div>
              </div>
            </div>

            <div class="glass-card p-4 rounded-2xl border border-slate-700/60 space-y-2">
              <div class="text-xs font-bold text-slate-300">스코어 분포 (Score Breakdown)</div>
              <div class="grid grid-cols-5 gap-1.5 text-center">
                <div class="bg-rose-950/60 border border-rose-800/40 p-2 rounded-xl">
                  <div class="text-[10px] text-rose-300 font-medium">버디 이상</div>
                  <div class="text-lg font-black text-rose-400">${stats.scoreDistribution.birdie + stats.scoreDistribution.eagle + stats.scoreDistribution.albatross}</div>
                </div>
                <div class="bg-emerald-950/60 border border-emerald-800/40 p-2 rounded-xl">
                  <div class="text-[10px] text-emerald-300 font-medium">파 (0)</div>
                  <div class="text-lg font-black text-emerald-400">${stats.scoreDistribution.par}</div>
                </div>
                <div class="bg-blue-950/60 border border-blue-800/40 p-2 rounded-xl">
                  <div class="text-[10px] text-blue-300 font-medium">보기 (+1)</div>
                  <div class="text-lg font-black text-blue-400">${stats.scoreDistribution.bogey}</div>
                </div>
                <div class="bg-indigo-950/60 border border-indigo-800/40 p-2 rounded-xl">
                  <div class="text-[10px] text-indigo-300 font-medium">더블 (+2)</div>
                  <div class="text-lg font-black text-indigo-400">${stats.scoreDistribution.doubleBogey}</div>
                </div>
                <div class="bg-slate-800 border border-slate-700 p-2 rounded-xl">
                  <div class="text-[10px] text-slate-300 font-medium">트리플+</div>
                  <div class="text-lg font-black text-slate-400">${stats.scoreDistribution.triplePlus}</div>
                </div>
              </div>
            </div>
          ` : ''}

          <div class="space-y-2 pt-2">
            <button onclick="window.appActions.openScorecardModalWithRound('${round.id}')"
                    class="w-full py-3.5 bg-slate-800 hover:bg-slate-700 text-emerald-300 border border-emerald-500/40 font-bold rounded-2xl text-xs flex items-center justify-center gap-2 shadow">
              <span>📊</span> 18홀 상세 스코어카드 표 보기 (홀별 수정 가능)
            </button>

            <button onclick="window.appActions.startEditingCompletedRound('${round.id}')"
                    class="w-full py-3 bg-emerald-700/80 hover:bg-emerald-600 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 shadow">

            </button>

            <div class="grid grid-cols-2 gap-2">
              <button onclick="window.appActions.copyRoundSummaryText('${round.id}')"
                      class="py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold rounded-xl text-xs flex items-center justify-center gap-1.5">

    function renderHistoryView() {

      const filterCourse = state.historyCourseFilter || 'all';

                      </button>

                      <div class="flex items-center gap-2">
                        <button onclick="window.appActions.startEditingCompletedRound('${r.id}')"
                                class="text-emerald-400 hover:text-emerald-300 font-bold">

                      </div>

              }).join('')}

          `}
        </div>
      `;

    function renderApp() {
      const appContainer = document.getElementById('app');
      if (!appContainer) return;

      let bodyHtml = '';
      switch (state.currentView) {
        case 'home': bodyHtml = renderHomeView(); break;
        case 'newRoundSetup': bodyHtml = renderNewRoundModal(); break;
        case 'liveRound': bodyHtml = renderRoundLiveView(); break;
        case 'summary': bodyHtml = renderRoundSummaryView(); break;
        case 'history': bodyHtml = renderHistoryView(); break;
        case 'stats': bodyHtml = renderStatsView(); break;
        case 'courses': bodyHtml = renderCourseManagerView(); break;
        default: bodyHtml = renderHomeView();
      }

      let modalsHtml = '';
      if (state.isUserModalOpen) modalsHtml += renderUserModal();
      if (state.isSyncModalOpen) modalsHtml += renderSyncModal();
      if (state.isScorecardModalOpen) modalsHtml += renderScorecardModal();
      if (state.isCourseEditModalOpen) modalsHtml += renderCourseEditModal();

      appContainer.innerHTML = `
        ${renderHeader()}
        <main class="flex-1 w-full overflow-y-auto">
          ${bodyHtml}
        </main>
        ${renderNavigation()}
        ${modalsHtml}
      `;
    }

    function updateActiveHoleInRound(holeMutator) {
      if (!state.activeRound) return;
      const hIdx = state.currentHoleIndex;
      const currentHole = state.activeRound.holes[hIdx];
      if (!currentHole) return;

      holeMutator(currentHole);

      const par = currentHole.par || 4;
      const score = currentHole.score;
      const putts = currentHole.putts !== undefined ? currentHole.putts : 2;
      if (currentHole.girAuto !== false) {
        currentHole.gir = ((score - putts) <= (par - 2));
      }

      state.activeRound.totalScore = state.activeRound.holes.reduce((sum, h) => sum + (h.score || 0), 0);
      const totalPar = state.activeRound.holes.reduce((sum, h) => sum + (h.par || 4), 0);
      state.activeRound.totalPar = totalPar;
      state.activeRound.overPar = state.activeRound.totalScore - totalPar;

      const rounds = StorageService.getRounds(state.currentUser);
      const existIdx = rounds.findIndex(r => r.id === state.activeRound.id);
      if (existIdx !== -1) {
        rounds[existIdx] = { ...state.activeRound, playerName: state.currentUser };
        StorageService.saveRounds(rounds, state.currentUser);
        state.rounds = rounds;
      } else {
        StorageService.saveActiveRound(state.activeRound, state.currentUser);
      }

      renderApp();
    }

    // 7. 글로벌 액션 바인딩
    // ==========================================
    window.appActions = {
      navigate: (viewName) => {
        state.currentView = viewName;
        if (viewName === 'stats') {
          if (!state.statsSelectedCourseId && state.courses.length > 0) {
            state.statsSelectedCourseId = state.courses[0].id;
            state.statsSelectedSubCourseId = state.courses[0].subCourses[0]?.id;
          }
        }
        renderApp();
        window.scrollTo(0, 0);
      },

      // 기기간 데이터 동기화 모달 액션
      openSyncModal: () => {
        state.isSyncModalOpen = true;
        state.syncStatusMessage = '';
        renderApp();
      },

      closeSyncModal: () => {
        state.isSyncModalOpen = false;
        state.syncStatusMessage = '';
        renderApp();
      },

      generateCloudSyncCode: async () => {
        state.cloudSyncLoading = true;
        state.syncStatusMessage = '⏳ 클라우드에 데이터를 안전하게 업로드 중입니다...';
        renderApp();

        const res = await StorageService.uploadToCloud();
        state.cloudSyncLoading = false;
        if (res.success) {
          state.cloudSyncCode = res.code;
          state.syncStatusMessage = '✅ 업로드 성공! PC나 다른 브라우저에서 위 6자리 번호를 입력하세요.';
        } else {
          state.syncStatusMessage = '⚠️ 클라우드 서버 응답 지연. 아래 [동기화 링크 복사] 또는 [파일 저장]을 이용해주세요!';
        }
        renderApp();
      },

      restoreFromCloudSyncCode: async () => {
        const input = document.getElementById('syncCodeInput');
        const code = input ? input.value.trim() : state.cloudSyncCode;
        if (!code) {
          alert('6자리 동기화 번호를 입력해주세요.');
          return;
        }

        state.cloudSyncLoading = true;
        state.syncStatusMessage = '⏳ 클라우드에서 데이터를 다운로드하여 동기화하는 중입니다...';
        renderApp();

        const res = await StorageService.downloadFromCloud(code);
        state.cloudSyncLoading = false;
        if (res.success) {
          state.currentUser = UserService.getCurrentUser();
          state.users = UserService.getAllUsers();
          state.courses = StorageService.getCourses();
          state.rounds = StorageService.getRounds(state.currentUser);
          state.syncStatusMessage = `🎉 동기화 성공! '${state.currentUser}' 님의 ${state.rounds.length}개 라운드 데이터가 완벽히 로드되었습니다!`;
          alert(`🎉 '${state.currentUser}' 님의 ${state.rounds.length}개 라운드 데이터가 완벽하게 동기화되었습니다!`);
          state.isSyncModalOpen = false;
          renderApp();
        } else {
          state.syncStatusMessage = '❌ ' + res.error;
          alert('❌ 동기화 실패: ' + res.error);
          renderApp();
        }
      },

      copySyncUrl: async () => {
        try {
          state.syncStatusMessage = '⏳ 카카오톡 공유용 단축 링크 생성 중...';
          renderApp();

          const baseHref = window.location.href.split('#')[0].split('?')[0];
          let syncUrl = '';

          // 1. 클라우드에 먼저 업로드하여 초단축 링크 생성
          const cloudRes = await StorageService.uploadToCloud();
          if (cloudRes.success && cloudRes.code && !cloudRes.rawBase64) {
            syncUrl = `${baseHref}?c=${cloudRes.code}`;
            state.cloudSyncCode = cloudRes.code;
          } else {
            // 2. 직접 안전 Base64 인코딩 URL 생성
            const payload = StorageService.getExportPayload();
            const jsonStr = JSON.stringify(payload);
            const safeB64 = StorageService.encodeToSafeBase64(jsonStr);
            syncUrl = `${baseHref}#sync=${safeB64}`;
          }

          state.syncStatusMessage = '✅ 동기화 링크가 복사되었습니다!';
          renderApp();

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(syncUrl).then(() => {
              alert('📋 카카오톡 전송용 동기화 링크가 복사되었습니다!\n\n카카오톡 "나에게 보내기"로 보낸 후, PC에서 클릭하시면 모바일의 모든 스코어가 1초 만에 그대로 복원됩니다!');
            }).catch(() => {
              prompt('아래 링크를 복사하여 PC 브라우저나 카카오톡에 붙여넣으세요:', syncUrl);
            });
          } else {
            prompt('아래 링크를 복사하여 PC 브라우저나 카카오톡에 붙여넣으세요:', syncUrl);
          }
        } catch (e) {
          alert('동기화 링크 생성 중 오류: ' + e.message);
        }
      },

      copySyncCodeText: () => {
        try {
          const payload = StorageService.getExportPayload();
          const jsonStr = JSON.stringify(payload);
          const safeB64 = StorageService.encodeToSafeBase64(jsonStr);
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(safeB64).then(() => {
              alert('📋 백업 텍스트 코드가 복사되었습니다!\n\n카카오톡으로 보낸 후, PC에서 [붙여넣고 복원]을 누르세요.');
            }).catch(() => {
              prompt('아래 텍스트 코드를 전체 복사하세요:', safeB64);

            prompt('아래 텍스트 코드를 전체 복사하세요:', safeB64);
          }
        } catch (e) {
          alert('복사 실패: ' + e.message);
        }
      },

      pasteSyncCodeTextPrompt: () => {
        const text = prompt('카카오톡 등으로 전달받은 백업 텍스트 코드를 여기에 붙여넣으세요:');

              state.currentUser = UserService.getCurrentUser();

        }
      },

      exportJsonFile: () => {
        StorageService.exportData();
      },

      importJsonFile: (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const res = StorageService.importData(evt.target.result);
          if (res.success) {
            state.currentUser = UserService.getCurrentUser();
            state.users = UserService.getAllUsers();
            state.courses = StorageService.getCourses();
            state.rounds = StorageService.getRounds(state.currentUser);
            alert(`🎉 백업 파일이 성공적으로 복원되었습니다!\n총 ${state.rounds.length}개의 라운드가 로드되었습니다.`);
            state.isSyncModalOpen = false;
            renderApp();
          } else {
            alert('❌ 파일 복원에 실패했습니다: ' + res.error);
          }
        };
        reader.readAsText(file);
      },

      // 멀티 유저 닉네임 액션
      openUserModal: () => {
        state.users = UserService.getAllUsers();

      copyRoundsPrompt: () => {
        const otherUsers = state.users.filter(u => u !== state.currentUser);
        if (otherUsers.length === 0) {
          alert('가져올 수 있는 다른 닉네임이 없습니다.');
          return;
        }
        const sourceUser = prompt(`어떤 사용자의 라운드 기록을 현재 '${state.currentUser}' 님에게 복사할까요?\n(가능한 사용자: ${otherUsers.join(', ')})`, otherUsers[0]);
        if (sourceUser && sourceUser.trim()) {
          const cleanSource = sourceUser.trim();
          if (cleanSource === state.currentUser) {
            alert('동일한 사용자입니다.');
            return;

          const count = StorageService.copyRoundsFromUser(cleanSource, state.currentUser);

      changeCurrentHolePar: (newPar) => {
        updateActiveHoleInRound(h => {
          const oldPar = h.par || 4;
          const diff = h.score - oldPar;
          h.par = newPar;
          h.score = Math.max(1, newPar + diff);
          if (newPar === 3) {
            h.fairway = 'none';
          } else if (h.fairway === 'none') {
            h.fairway = 'center';
          }
        });

      setHoleScore: (score) => {
        updateActiveHoleInRound(h => { h.score = Math.max(1, score); });
      },

      adjustHoleScore: (delta) => {
        updateActiveHoleInRound(h => {
          const current = h.score !== undefined ? h.score : (h.par || 4);
          h.score = Math.max(1, current + delta);
        });

      promptExactScore: () => {
        const currentHole = state.activeRound?.holes[state.currentHoleIndex];
        const par = currentHole?.par || 4;
        const current = currentHole?.score || par;

        const input = prompt(`홀 오버파(보기 +1, 파 0, 버디 -1 등) 또는 총 타수를 입력하세요:\n(현재: ${diff >= 0 ? `+${diff}` : diff}, 총 ${current}타)`, `${diff}`);
        if (input !== null && input.trim() !== '') {
          const num = parseInt(input.trim(), 10);
          if (!isNaN(num)) {
            if (num <= 10 && num >= -5) {
              window.appActions.setHoleScore(par + num);
            } else {
              window.appActions.setHoleScore(num);

    async function initApp() {
      // 1. URL 쿼리 파라미터 및 해시 감지 (?c=코드 또는 ?sync=데이터 또는 #sync=데이터)
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const cloudCode = urlParams.get('c') || urlParams.get('code');
        const querySync = urlParams.get('sync');
        const hash = window.location.hash || '';

        if (cloudCode) {
          // 클라우드 단축 코드 감지 ➔ 즉시 다운로드 & 복원
          const res = await StorageService.downloadFromCloud(cloudCode);
          if (res.success) {
            history.replaceState(null, null, window.location.pathname);
            alert(`🎉 클라우드 동기화 완료!\n모바일에서 기록한 라운드 데이터가 성공적으로 복원되었습니다.`);
          }
        } else if (querySync || hash.startsWith('#sync=')) {
          const rawEncoded = querySync || hash.replace('#sync=', '');
          const decodedStr = StorageService.decodeFromSafeBase64(rawEncoded);
          if (decodedStr) {
            const parsed = JSON.parse(decodedStr);
            if (parsed && (parsed.currentUser || parsed.users)) {
              StorageService.importPayload(parsed);
              history.replaceState(null, null, window.location.pathname);
              alert(`🎉 데이터 동기화 완료!\n'${parsed.currentUser || "사용자"}' 님의 라운드 기록이 복원되었습니다.`);
            }
          }
        }
      } catch (e) {
        console.warn('URL 자동 동기화 처리 실패:', e);
      }

      state.currentUser = UserService.getCurrentUser();
      state.users = UserService.getAllUsers();
      state.courses = StorageService.getCourses();
      state.rounds = StorageService.getRounds(state.currentUser);
      
      // 가비지 진행중 라운드 자동 청소 (이미 완료된 라운드이거나 불완전한 잔여 데이터 삭제)
      const rawActive = StorageService.getActiveRound(state.currentUser);
      if (rawActive && state.rounds.some(r => r.id === rawActive.id || (r.courseName === rawActive.courseName && r.date === rawActive.date))) {
        StorageService.clearActiveRound(state.currentUser);
        state.activeRound = null;
      } else {
        state.activeRound = rawActive;
      }

      state.currentView = 'home';
      renderApp();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
